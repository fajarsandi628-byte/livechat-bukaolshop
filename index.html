<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: #f8f6f0; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
    .profile-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; background: #e6f7f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #e50914; font-size: 18px; }
    .title-area h2 { font-size: 15px; }
    .status { font-size: 11px; color: #777; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; background: #e50914; border-radius: 50%; }
    .alert-banner { background: #fde8e8; color: #666; font-size: 12px; padding: 10px; margin: 10px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; }
    
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .message.user { align-self: flex-end; background-color: #e50914; color: white; border-bottom-right-radius: 2px; }
    .message.admin { align-self: flex-start; background-color: #ffffff; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .message .time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }

    .welcome-card { text-align: center; margin: auto; }
    .welcome-icon { width: 60px; height: 60px; background: #e0f7fa; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 24px; }

    .footer { padding: 12px; display: flex; gap: 10px; }
    .input-wrapper { flex: 1; background: #fff; border-radius: 25px; display: flex; align-items: center; padding: 8px 16px; }
    .chat-input { border: none; outline: none; width: 100%; font-size: 14px; }
    .send-btn { width: 40px; height: 40px; background: #e50914; border-radius: 50%; border: none; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="profile-info">
      <div class="avatar"><i class="fa-solid fa-headset"></i></div>
      <div class="title-area">
        <h2>Customer Service</h2>
        <div class="status"><span class="status-dot"></span> Online</div>
      </div>
    </div>
  </div>

  <div class="alert-banner" id="alertBanner">
    <span>⚠️ Pesan lebih dari 7 hari terakhir akan otomatis dihapus oleh sistem</span>
    <i class="fa-solid fa-xmark" onclick="this.parentElement.style.display='none'" style="cursor:pointer"></i>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="welcome-card" id="welcomeCard">
      <div class="welcome-icon"><i class="fa-regular fa-comment-dots"></i></div>
      <h3>Hai, Kamu! 👋</h3>
      <p style="font-size: 12px; color: #777;">Ada pertanyaan atau kendala?<br>Tim CS kami siap membantu kamu.</p>
    </div>
  </div>

  <div class="footer">
    <div class="input-wrapper">
      <input type="text" class="chat-input" id="messageInput" placeholder="Masukkan pesan Anda ....">
    </div>
    <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script>
    // 1. Konfigurasi Firebase Anda (Ganti dengan kredensial Firebase Anda)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Mengambil Parameter ID Pembeli dari URL Bukaolshop
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id') || "guest_" + Math.floor(Math.random() * 1000);
    const userName = urlParams.get('nama') || "Pembeli";

    const chatRef = db.ref('chats/' + userId);

    // 3. Membaca Pesan Real-time
    chatRef.on('value', (snapshot) => {
      const chatBody = document.getElementById('chatBody');
      const welcomeCard = document.getElementById('welcomeCard');
      chatBody.innerHTML = ''; 

      if (!snapshot.exists()) {
        chatBody.appendChild(welcomeCard);
        return;
      }

      snapshot.forEach((childSnapshot) => {
        const msg = childSnapshot.val();
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', msg.sender === 'user' ? 'user' : 'admin');
        
        const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        msgDiv.innerHTML = `${msg.text} <div class="time">${timeStr}</div>`;
        
        chatBody.appendChild(msgDiv);
      });

      chatBody.scrollTop = chatBody.scrollHeight;
    });

    // 4. Fungsi Kirim Pesan
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (text !== '') {
        chatRef.push({
          sender: 'user',
          userName: userName,
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    }

    // Kirim pesan saat menekan Enter
    document.getElementById('messageInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
