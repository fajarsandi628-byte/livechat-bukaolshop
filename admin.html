<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin CS - Live Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f0f2f5; }

    /* Sidebar Daftar Chat */
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      background: #e50914;
      color: white;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
    }

    .user-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .user-item:hover, .user-item.active {
      background: #f7f7f7;
    }

    .user-item .name {
      font-weight: 600;
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
    }

    .user-item .last-msg {
      font-size: 12px;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Area Chat Main */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f8f6f0;
    }

    .chat-header {
      padding: 14px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 60%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-start;
      background: #ffffff;
      color: #333;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .message.admin {
      align-self: flex-end;
      background: #e50914;
      color: white;
    }

    .message .time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .chat-footer {
      padding: 16px;
      background: #ffffff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }

    .send-btn {
      padding: 10px 20px;
      background: #e50914;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    .no-chat-selected {
      margin: auto;
      text-align: center;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Sidebar Pembeli -->
  <div class="sidebar">
    <div class="sidebar-header">
      <i class="fa-solid fa-headset"></i> Panel CS Admin
    </div>
    <div class="user-list" id="userList">
      <!-- Daftar pembeli akan muncul otomatis di sini -->
    </div>
  </div>

  <!-- Area Chat Utama -->
  <div class="main-chat">
    <div class="chat-header" id="chatHeader">
      <span id="activeUserName">Pilih percakapan di samping</span>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="no-chat-selected">
        <i class="fa-regular fa-comments" style="font-size: 48px; margin-bottom: 10px;"></i>
        <p>Silakan pilih obrolan dari daftar pelanggan di sebelah kiri.</p>
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" class="chat-input" id="messageInput" placeholder="Ketik balasan admin..." disabled>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Kirim</button>
    </div>
  </div>

  <script>
    // 1. Samakan Konfigurasi Firebase Anda dengan file index.html
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let activeUserId = null;

    // 2. Membaca Seluruh Daftar Obrolan Pembeli
    db.ref('chats').on('value', (snapshot) => {
      const userList = document.getElementById('userList');
      userList.innerHTML = '';

      if (!snapshot.exists()) {
        userList.innerHTML = '<div style="padding:16px; color:#888; text-align:center;">Belum ada pesan masuk.</div>';
        return;
      }

      snapshot.forEach((childSnapshot) => {
        const userId = childSnapshot.key;
        const messages = childSnapshot.val();
        
        // Ambil pesan terakhir & nama user
        const msgKeys = Object.keys(messages);
        const lastMsgObj = messages[msgKeys[msgKeys.length - 1]];
        const userName = lastMsgObj.userName || "Pembeli (" + userId + ")";

        const userItem = document.createElement('div');
        userItem.classList.add('user-item');
        if (userId === activeUserId) userItem.classList.add('active');

        userItem.onclick = () => selectUser(userId, userName);

        userItem.innerHTML = `
          <div class="name">${userName}</div>
          <div class="last-msg">${lastMsgObj.sender === 'admin' ? 'Anda: ' : ''}${lastMsgObj.text}</div>
        `;

        userList.appendChild(userItem);
      });
    });

    // 3. Membuka Percakapan Pembeli yang Dipilih
    function selectUser(userId, userName) {
      activeUserId = userId;
      document.getElementById('activeUserName').innerText = "Chat dengan: " + userName;
      document.getElementById('messageInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;

      // Update style aktif di sidebar
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));

      // Dapatkan pesan real-time pembeli terpilih
      db.ref('chats/' + userId).on('value', (snapshot) => {
        const chatBody = document.getElementById('chatBody');
        chatBody.innerHTML = '';

        snapshot.forEach((childSnapshot) => {
          const msg = childSnapshot.val();
          const msgDiv = document.createElement('div');
          msgDiv.classList.add('message', msg.sender === 'user' ? 'user' : 'admin');

          const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          msgDiv.innerHTML = `${msg.text} <div class="time">${timeStr}</div>`;

          chatBody.appendChild(msgDiv);
        });

        chatBody.scrollTop = chatBody.scrollHeight;
      });
    }

    // 4. Balas Pesan sebagai Admin
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (text !== '' && activeUserId) {
        db.ref('chats/' + activeUserId).push({
          sender: 'admin',
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    }

    document.getElementById('messageInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
